<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Portfolio Admin</title>
    <link rel="icon" type="image/webp" href="https://banquet.arraffi.com/portfolio/assets/site.webp">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin.css">
    <script src="turnstile.js" defer></script>
    <script src="admin.js" defer></script>
</head>
<body>
    <div id="toast" class="save-toast" role="status" aria-live="polite"></div>

    <main id="login-view" class="login-wrap hidden">
        <section class="login-card">
            <h2>Admin Panel</h2>
            <p>Enter your password to continue</p>
            <form id="login-form">
                <div class="field">
                    <label for="admin-password">Password</label>
                    <input id="admin-password" type="password" placeholder="••••••••••••" autocomplete="current-password" required>
                </div>
                <div id="admin-turnstile" class="turnstile-container"></div>
                <button id="login-button" class="btn btn-primary btn-full" type="submit">Sign In</button>
                <p id="login-error" class="form-error hidden"></p>
            </form>
        </section>
    </main>

    <main id="admin-view" class="shell hidden">
        <header class="topbar">
            <span class="topbar-title">⚙ Portfolio CMS</span>
            <button id="logout-button" class="logout-btn" type="button">Sign out</button>
        </header>

        <section class="content">
            <nav class="tabs" aria-label="Admin sections">
                <button class="tab active" type="button" data-tab="projects">Projects</button>
                <button class="tab" type="button" data-tab="experience">Experience</button>
                <button class="tab" type="button" data-tab="comments">Comments <span id="comment-count" class="badge hidden">0</span></button>
            </nav>

            <section id="projects-panel" class="panel"></section>
            <section id="experience-panel" class="panel hidden"></section>
            <section id="comments-panel" class="panel hidden"></section>
        </section>
    </main>

    <div id="modal-root" class="modal-overlay hidden" role="dialog" aria-modal="true"></div>
</body>
</html>
